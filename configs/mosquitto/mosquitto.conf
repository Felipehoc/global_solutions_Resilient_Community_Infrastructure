# ==============================================================================
# Eclipse Mosquitto - Broker MQTT Local da Borda (Rede Comunitária Vila Aurora)
# Requisitos: RT-02 (Broker Local), RT-04 (mTLS X.509 único), RT-05 (Revogação CRL)
# ==============================================================================

# Desabilita totalmente conexões não criptografadas (Porta 1883 bloqueada)
per_listener_settings true
allow_anonymous false

# Listener mTLS Seguro na Porta 8883
listener 8883 0.0.0.0
protocol mqtt

# Certificados emitidos pela CA Própria do Projeto (VilaAurora-Root-CA)
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto-server.crt
keyfile /mosquitto/certs/mosquitto-server.key

# Exige certificado X.509 individual por dispositivo (mTLS Obrigatório - RT-04)
require_certificate true
use_identity_as_username true
tls_version tlsv1.3

# Lista de Revogação de Certificados (CRL) ativa para bloqueio imediato (RT-05)
crlfile /mosquitto/certs/crl.pem

# Persistência local para resiliência na borda (RT-02)
persistence true
persistence_location /mosquitto/data/

# Logs detalhados para auditoria e SIEM (RT-12, RT-13c)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
connection_messages true
