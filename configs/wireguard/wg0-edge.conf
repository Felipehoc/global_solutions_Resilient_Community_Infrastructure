# ==============================================================================
# WireGuard VPN - Nó de Borda (Edge Node -> Cloud Core)
# Requisito RT-06: Cifras modernas (ChaCha20-Poly1305, Curve25519, BLAKE2s)
# ==============================================================================
# NOTA: Chaves privadas reais são geradas localmente via script e NÃO versionadas.

[Interface]
# Endereço do Nó de Borda no Túnel VPN
Address = 10.200.0.2/24
PrivateKey = <GENERATED_AT_RUNTIME_DO_NOT_COMMIT_EDGE_PRIVKEY>
DNS = 10.200.0.1
MTU = 1420

# Regras de Firewall de Borda (Menor Privilégio - RT-07)
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# Gateway Central de Nuvem (Vila Aurora Core)
PublicKey = VAh9xK8mP2qL5nZ7wR4tY6uI1oP3aS5dF7gH9jK2lM4=
PresharedKey = <GENERATED_AT_RUNTIME_PSK_SYMMETRIC_ROTATED>
Endpoint = vpn.vilaaurora.org.br:51820
AllowedIPs = 10.200.0.1/32, 172.28.30.0/24
PersistentKeepalive = 25
